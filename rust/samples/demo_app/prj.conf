# The C++ demo_app's prj.conf without its C++ options and the ADC it never reads on this
# board; the Rust application needs no Zephyr option of its own.
CONFIG_EVENTS=y
CONFIG_THREAD_NAME=y

# needed for stack size measurement
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# task switch tracing
CONFIG_TRACING=y
CONFIG_TRACING_USER=y

CONFIG_SERIAL=y

CONFIG_CAN=y
CONFIG_CAN_INIT_PRIORITY=80

CONFIG_PWM=y

CONFIG_NO_OPTIMIZATIONS=n
CONFIG_REBOOT=y
