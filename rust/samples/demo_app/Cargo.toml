[package]
# rust_app.cmake links librustapp.a, so the package is named rustapp.
name = "rustapp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OpenBSW's demo_app in Rust, as a Zephyr application"

[lib]
crate-type = ["staticlib"]
test = false
bench = false

[dependencies]
openbsw-async.workspace = true
openbsw-async-zephyr.workspace = true
openbsw-bsp-zephyr.workspace = true
openbsw-console.workspace = true
openbsw-cpp2can.workspace = true
openbsw-lifecycle.workspace = true
openbsw-logger.workspace = true
openbsw-runtime.workspace = true
openbsw-timer.workspace = true
openbsw-util.workspace = true
openbsw-zephyr-ffi.workspace = true
