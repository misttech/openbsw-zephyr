# The Rust port of OpenBSW's Zephyr adaptation and of the demo application. The OpenBSW
# library crates come from the openbsw tree checked out beside this one, as west and
# Forkpoint's prebuilt/third_party/ lay them out. See README.md.
[workspace]
resolver = "3"
members = ["zephyr-ffi", "async-zephyr", "bsp-zephyr", "samples/demo_app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
openbsw-util = { path = "../../openbsw/rust/util" }
openbsw-timer = { path = "../../openbsw/rust/timer" }
openbsw-async = { path = "../../openbsw/rust/async" }
openbsw-lifecycle = { path = "../../openbsw/rust/lifecycle" }
openbsw-logger = { path = "../../openbsw/rust/logger" }
openbsw-cpp2can = { path = "../../openbsw/rust/cpp2can" }
openbsw-runtime = { path = "../../openbsw/rust/runtime" }
openbsw-console = { path = "../../openbsw/rust/console" }
openbsw-transport = { path = "../../openbsw/rust/transport" }
openbsw-docan = { path = "../../openbsw/rust/docan" }
openbsw-uds = { path = "../../openbsw/rust/uds" }
openbsw-zephyr-ffi = { path = "zephyr-ffi" }
openbsw-async-zephyr = { path = "async-zephyr" }
openbsw-bsp-zephyr = { path = "bsp-zephyr" }

# The firmware optimizes for speed, as OpenBSW's CMake builds its C++ libraries (-O2,
# over Zephyr's -Os). Fat LTO stands in for the C++ headers inlined across libraries: the
# hot paths (locks, timers, the context-switch hooks) cross crates. See PORTING.md. Keep
# debug info for the ELF and panic = "abort" since there is no unwinder on the target.
[profile.dev]
panic = "abort"
opt-level = 3
debug = true
codegen-units = 1
lto = "fat"

[profile.release]
panic = "abort"
opt-level = 3
debug = true
codegen-units = 1
lto = "fat"
