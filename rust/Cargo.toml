# The Rust port of OpenBSW's Zephyr adaptation and of the demo application. The OpenBSW
# library crates come from the openbsw tree checked out beside this one, as west and
# Forkpoint's prebuilt/third_party/ lay them out. See README.md.
[workspace]
resolver = "3"
members = ["zephyr-ffi", "samples/demo_app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
openbsw-util = { path = "../../openbsw/rust/util" }
openbsw-zephyr-ffi = { path = "zephyr-ffi" }

# The firmware builds optimized, as the C++ build does (-O2); keep debug info for the
# ELF and panic = "abort" since there is no unwinder on the target.
[profile.dev]
panic = "abort"
opt-level = 2
debug = true
codegen-units = 1

[profile.release]
panic = "abort"
opt-level = 2
debug = true
codegen-units = 1
